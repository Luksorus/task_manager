services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  auth-service:
    image: auth-service:latest
    ports:
      - "8001:8001"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  task-service:
    image: task-service:latest
    ports:
      - "8002:8002"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
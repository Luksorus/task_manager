server {
    listen 80;
    
    location / {
        return 200 "Smart Task Manager Gateway\n\nEndpoints:\n- /auth/health - Auth Service\n- /tasks/health - Task Service\n";
        add_header Content-Type text/plain;
    }
    
    # Вариант 1: Проксируем без удаления префикса
    location /auth {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Вариант 2: Проксируем с удалением префикса (если нужно)
    location /tasks {
        proxy_pass http://task-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

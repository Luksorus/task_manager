services:
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - task-service

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:8001"

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "8002:8002"